task: longbench2_kimi_120k
dataset_path: THUDM/LongBench-v2
test_split: train
output_type: generate_until
process_docs: !function utils.process_docs
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
process_results: !function utils.process_results
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128
  until: ["<|im_end|>"]   # the server stops at EOS anyway; lm-eval's default "\n\n" could cut a leading blank line
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: parsed
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
